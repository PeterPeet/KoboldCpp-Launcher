<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KoboldCpp Launcher</title>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <div class="app">
      <header class="bar">
        <div class="brand"><img class="klogo" src="/src/assets/koboldai-logo.png" alt="" width="28" height="28" />KoboldCpp</div>
        <a class="verlink" href="https://github.com/LostRuins/koboldcpp" target="_blank" rel="noopener" title="Open the KoboldCpp repository on GitHub"
          ><svg class="gh" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" /></svg
          ><span class="ver" id="verLabel"></span
        ></a>
        <nav class="nav" aria-label="Screens">
          <a href="#start" data-route="start">Start</a>
          <a href="#library" data-route="library">Library</a>
          <a href="#advanced" data-route="advanced">Advanced setup</a>
        </nav>
        <span class="spacer"></span>
        <span class="pill p-warn" id="previewPill" title="Running in a normal browser: all data are examples" hidden>Browser preview</span>
        <button class="upd" id="updBtn"></button>
        <button class="ghost" id="openSources">Sources</button>
        <span class="status" id="status"><span class="dot"></span><span id="statusText">Server stopped</span></span>
      </header>
      <main class="screen" id="screen"></main>
    </div>
    <div id="dialogRoot"></div>
    <div id="toastRoot"></div>
  </body>
</html>
