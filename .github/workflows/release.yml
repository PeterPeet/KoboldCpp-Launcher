# Builds the launcher for macOS, Windows and Linux when a version tag is pushed (e.g. v0.1.0)
# and attaches the installers to a draft GitHub release. GitHub adds "Source code (zip)" and
# "(tar.gz)" to every release on its own. Review the draft, then press "Publish release".
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest          # Apple Silicon (.dmg, .app)
            args: --target aarch64-apple-darwin
            label: macOS
          - platform: windows-latest        # .msi and setup .exe
            args: ""
            label: Windows
          - platform: ubuntu-22.04          # .AppImage, .deb, .rpm (x86_64)
            args: ""
            label: Linux
          - platform: ubuntu-22.04-arm      # .AppImage, .deb, .rpm (arm64)
            args: ""
            label: Linux
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: KoboldCpp Launcher ${{ github.ref_name }}
          releaseBody: |
            A modern launcher for KoboldCpp: finds models that fit your PC, downloads them and starts KoboldCpp. See the README for everything it does.

            **Which file?**
            - **macOS** (Apple Silicon): `…_macOS_aarch64.dmg`
            - **Windows**: `…_Windows_x64-setup.exe` (or the `.msi`)
            - **Linux**: `.AppImage` (any distribution), `.deb` (Debian, Ubuntu), `.rpm` (Fedora, openSUSE). `amd64`/`x86_64` = Intel/AMD PCs, `aarch64`/`arm64` = ARM.

            On first start the launcher installs the matching official KoboldCpp release for you.

            The installers are not signed yet. macOS: right-click the app › **Open** the first time. Windows: **More info › Run anyway** in the SmartScreen warning.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # File names say the system: KoboldCpp-Launcher_0.1.0_macOS_aarch64.dmg,
          # …_Windows_x64-setup.exe, …_Linux_amd64.AppImage
          assetNamePattern: KoboldCpp-Launcher_[version]_${{ matrix.label }}_[arch][setup][ext]
